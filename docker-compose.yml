services:
  app:
    build: .
    ports:
      - "${PORT:-3030}:${PORT:-3030}"
    environment:
      PORT: "${PORT:-3030}"
      WRITE_KEY: ${WRITE_KEY:?set WRITE_KEY in .env (copy .env.example)}
      DB_PATH: /data/pjplanner.db
      # Address agents use to reach this server (the container cannot see the host LAN IP), e.g. http://192.168.1.20:3030
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Optional Jira integration (shared bot account); both empty = off
      JIRA_URL: ${JIRA_URL:-}
      JIRA_TOKEN: ${JIRA_TOKEN:-}
      # Master switch for writing to Jira (also needs the per-project toggle in the UI)
      JIRA_WRITE: ${JIRA_WRITE:-}
    volumes:
      - pjplanner-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${PORT:-3030}/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  pjplanner-data:
