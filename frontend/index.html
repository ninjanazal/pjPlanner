<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>pjPlanner</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<script>
  // Mirrors initialTheme() in src/theme.ts; runs before first paint to avoid a theme flash.
  (function () {
    var t;
    try { t = localStorage.getItem('pjplanner-theme'); } catch (e) {}
    if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
  })();
</script></head>
<body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
